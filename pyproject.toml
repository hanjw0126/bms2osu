[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bms2osu"
version = "0.4.0"
description = "Batch converter: BMS/BME/BML charts to osu!mania beatmaps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.21", "soundfile>=0.12"]
gui = ["tkinterdnd2>=0.4", "numpy>=1.21", "soundfile>=0.12"]

[project.scripts]
bms2osu = "bms2osu.cli:main"

[project.gui-scripts]
bms2osu-gui = "bms2osu.gui:main"

[tool.setuptools]
packages = ["bms2osu"]
